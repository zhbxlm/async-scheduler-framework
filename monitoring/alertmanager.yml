global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST:-localhost:25}'
  smtp_from: 'alertmanager@async-scheduler.local'
  smtp_auth_username: '${SMTP_USERNAME:-}'
  smtp_auth_password: '${SMTP_PASSWORD:-}'

# Alert routing tree
route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default-webhook'

  routes:
    # P0: Service completely down → immediate notify, repeat every 5m
    - match:
        severity: critical
        alertname: ServiceDown
      receiver: 'critical-ops'
      group_wait: 10s
      repeat_interval: 5m
      continue: false

    # P0: Redis HA circuit breaker open
    - match:
        severity: critical
        alertname: RedisCircuitBreakerOpen
      receiver: 'critical-ops'
      group_wait: 10s
      repeat_interval: 5m
      continue: false

    # P0: All other critical alerts
    - match:
        severity: critical
      receiver: 'critical-ops'
      group_wait: 15s
      repeat_interval: 10m

    # P1: Warning alerts → standard notify
    - match:
        severity: warning
      receiver: 'warning-ops'
      repeat_interval: 30m

    # P2: Info → webhook only, no repeat
    - match:
        severity: info
      receiver: 'default-webhook'
      repeat_interval: 6h

receivers:
  # Default webhook (all alerts)
  - name: 'default-webhook'
    webhook_configs:
      - url: '${WEBHOOK_URL:-http://localhost:8000/alerts/webhook}'
        send_resolved: true
        max_alerts: 50

  # Critical alerts: webhook + email + infoflow
  - name: 'critical-ops'
    webhook_configs:
      - url: '${WEBHOOK_URL:-http://localhost:8000/alerts/webhook}'
        send_resolved: true
    email_configs:
      - to: '${ALERT_EMAIL_TO:-ops@example.com}'
        send_resolved: true
        headers:
          Subject: '[CRITICAL][{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} - {{ .GroupLabels.service }}'
        html: |
          <h2>🔴 Critical Alert: {{ .GroupLabels.alertname }}</h2>
          {{ range .Alerts }}
          <p><b>Service:</b> {{ .Labels.service }}</p>
          <p><b>Summary:</b> {{ .Annotations.summary }}</p>
          <p><b>Description:</b> {{ .Annotations.description }}</p>
          <p><b>Started:</b> {{ .StartsAt }}</p>
          {{ if .Annotations.runbook_url }}<p><a href="{{ .Annotations.runbook_url }}">📖 Runbook</a></p>{{ end }}
          {{ end }}

  # Warning alerts: webhook only
  - name: 'warning-ops'
    webhook_configs:
      - url: '${WEBHOOK_URL:-http://localhost:8000/alerts/webhook}'
        send_resolved: true

# Inhibition rules: suppress warning when critical fires for same service
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['service']
