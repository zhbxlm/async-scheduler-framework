global:
  smtp_smarthost: 'localhost:25'
  smtp_from: 'alertmanager@async-scheduler.local'
  smtp_auth_username: ''
  smtp_auth_password: ''

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'webhook'
  
  routes:
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 10s
      repeat_interval: 5m
    
    - match:
        severity: warning  
      receiver: 'warning-webhook'
      repeat_interval: 30m

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'http://webhook:5000/webhook'
        send_resolved: true

  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://webhook:5000/webhook/critical'
        send_resolved: true

  - name: 'warning-webhook'
    webhook_configs:
      - url: 'http://webhook:5000/webhook/warning'
        send_resolved: true

  # Example email configuration (commented out)
