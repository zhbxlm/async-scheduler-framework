[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-worker"
version = "0.1.0"
description = "Ray AMU Worker SDK — base classes for building Ray workers"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Async Scheduler Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
ray = ["ray>=2.54"]
proxy = ["httpx>=0.26", "redis>=5.0", "requests>=2.31"]
all = ["ray>=2.54", "httpx>=0.26", "redis>=5.0", "requests>=2.31"]

[project.urls]
Homepage = "https://github.com/zhbxlm/async-scheduler-framework"
Repository = "https://github.com/zhbxlm/async-scheduler-framework"

[tool.setuptools.packages.find]
where = ["."]
include = ["async_worker*"]

[tool.setuptools.package-data]
async_worker = ["py.typed"]
