[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-proxy"
version = "0.1.0"
description = "Ray AMU Async Proxy — sidecar for long-running service async wrapping"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "AMU Team", email = "amu@baidu.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "redis>=5.0",
]

[project.scripts]
async-proxy = "async_proxy.async_service_proxy:main"

[project.urls]
Homepage = "https://github.com/baidu/amu"
Repository = "https://github.com/baidu/amu"

[tool.setuptools.packages.find]
where = ["."]
include = ["async_proxy*"]

[tool.setuptools.package-data]
async_proxy = ["py.typed"]
