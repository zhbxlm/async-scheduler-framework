[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-control-plane"
version = "1.2.0"
description = "Standalone control-plane worker for async-scheduler — cron, reconcile, compensation and callback dispatch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "async-scheduler-runtime-core>=1.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "redis[hiredis]>=5.0",
    "orjson>=3.9",
    "httpx>=0.25",
]

[project.optional-dependencies]
full = [
    "async-scheduler-runtime-core[control-plane]>=1.2.0",
]

[project.scripts]
scheduler-control-plane = "scheduler_control_plane.server:main"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["scheduler_control_plane", "scheduler_control_plane.*"]

[tool.setuptools.package-dir]
"" = "../../src"
