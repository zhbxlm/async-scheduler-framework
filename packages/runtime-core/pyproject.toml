[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-runtime-core"
version = "1.1.0"
description = "Shared runtime/core implementation layer for independently packaged async-scheduler roles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "orjson>=3.9",
    "httpx>=0.25",
    "croniter>=1.3",
    "prometheus-client>=0.17",
    "fastapi>=0.104",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
