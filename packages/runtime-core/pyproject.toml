[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-runtime-core"
version = "1.2.0"
description = "Shared runtime/core implementation layer for independently packaged async-scheduler roles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # core data layer
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
# Install for tracing support
tracing = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-semantic-conventions>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20",
]
# Install when using Redis-backed storage
redis = ["redis>=5.0"]
# Install when using MySQL storage
mysql = ["pymysql>=1.1.0", "aiomysql>=0.2"]
# Install for serving (control-plane / task-api / ops-api hosts)
serving = ["fastapi>=0.104", "uvicorn[standard]>=0.24"]
# Install for cron scheduling
cron = ["croniter>=1.3"]
# Install for Prometheus metrics
metrics = ["prometheus-client>=0.17"]
# Full: everything
all = [
    "redis>=5.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "croniter>=1.3",
    "prometheus-client>=0.17",
    "orjson>=3.9",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-semantic-conventions>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
