[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-task-api"
version = "1.2.0"
description = "Task submission API service for async-scheduler — handles submit/query/cancel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "async-scheduler-runtime-core>=1.2.0",
    "click>=8.1",
    "uvicorn[standard]>=0.24",
]

[project.optional-dependencies]
# Full tracing stack — install when OTLP exporter is needed at this layer
tracing = [
    "async-scheduler-runtime-core[tracing]>=1.1.0",
]

[project.scripts]
scheduler-task-api = "scheduler_task_api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-dir]
"" = "src"
