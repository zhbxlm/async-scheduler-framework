[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-agent"
version = "1.2.0"
description = "Node Agent for async-scheduler — deploy worker nodes with a single command"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "async-scheduler-runtime-core>=1.2.0",
    "click>=8.1",
]

[project.optional-dependencies]
full = [
    "async-scheduler-runtime-core[agent]>=1.2.0",
]

[project.scripts]
scheduler-agent = "scheduler_agent.cli:main"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["scheduler_agent", "scheduler_agent.*"]
[tool.setuptools.package-dir]
"" = "../../src"
