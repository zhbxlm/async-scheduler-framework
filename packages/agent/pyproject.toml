[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-agent"
version = "0.1.0"
description = "Node agent for async-scheduler worker nodes"
requires-python = ">=3.10"
dependencies = [
    "async-scheduler-platform==0.1.0",
    "httpx>=0.25",
    "psutil>=5.9",
]

[project.scripts]
scheduler-agent = "src.agent.server:main"

[tool.setuptools.packages.find]
where = ["../../"]
include = ["src.agent*"]

[tool.setuptools.package-dir]
"" = "../.."
