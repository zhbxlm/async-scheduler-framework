[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-sdk"
version = "0.1.0"
description = "Python client SDK for async-scheduler — submit tasks, poll results, manage schedules"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["async", "scheduler", "task-queue", "distributed"]
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.scripts]
scheduler = "scheduler_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
