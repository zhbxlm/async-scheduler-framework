[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-platform"
version = "0.1.0"
description = "Scheduling platform: queue, DAG engine, task execution, reconciliation"
requires-python = ">=3.10"
dependencies = [
    "async-scheduler-core==0.1.0",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "croniter>=1.3",
    "httpx>=0.25",
    "orjson>=3.9",
]

[tool.setuptools.packages.find]
where = ["../../"]
include = ["src.platform*", "src.services*", "src.workload*", "src.middleware*"]

[tool.setuptools.package-dir]
"" = "../.."
