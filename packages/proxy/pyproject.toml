[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-proxy"
version = "1.1.0"
description = "Embed fire-and-forget async task dispatch into any existing service"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["redis>=5.0", "orjson>=3.9", "flask>=3.0", "requests>=2.28"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-dir]
"" = "src"
