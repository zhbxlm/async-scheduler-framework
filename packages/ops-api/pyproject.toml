[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-ops-api"
version = "0.1.0"
description = "Ops/Admin API service for async-scheduler — cluster, node, DAG, tenant and alert management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "orjson>=3.9",
    "httpx>=0.25",
    "prometheus-client>=0.17",
    "opentelemetry-api>=1.20",
    "croniter>=1.3",
    "ray>=2.5",
]

[project.scripts]
scheduler-ops-api = "scheduler_ops_api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-dir]
"" = "src"
