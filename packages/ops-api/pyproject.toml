[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-ops-api"
version = "1.2.0"
description = "Ops/Admin API service for async-scheduler — cluster, node, DAG, tenant and alert management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "async-scheduler-runtime-core>=1.2.0",
    "click>=8.1",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "redis[hiredis]>=5.0",
    "orjson>=3.9",
    "httpx>=0.25",
]

[project.optional-dependencies]
# Full tracing stack — install when OTLP exporter is needed at this layer
tracing = [
    "async-scheduler-runtime-core[tracing]>=1.2.0",
]
full = [
    "async-scheduler-runtime-core[ops-api]>=1.2.0",
]

[project.scripts]
scheduler-ops-api = "scheduler_ops_api.server:main"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["scheduler_ops_api", "scheduler_ops_api.*"]
[tool.setuptools.package-dir]
"" = "../../src"
