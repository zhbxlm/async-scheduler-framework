[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler-core"
version = "0.1.0"
description = "Core models, metrics and shared utilities for async-scheduler"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "prometheus-client>=0.17",
    "orjson>=3.9",
    "redis>=5.0",
    "opentelemetry-api>=1.20",
    "structlog>=23.0",
]

[tool.setuptools.packages.find]
where = ["../../"]
include = ["src.models*", "src.monitoring*", "src.common*"]

[tool.setuptools.package-dir]
"" = "../.."
