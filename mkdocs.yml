site_name: Async Scheduler
site_url: https://zhbxlm.github.io/async-scheduler-framework/
repo_url: https://github.com/zhbxlm/async-scheduler-framework
repo_name: zhbxlm/async-scheduler-framework
docs_dir: docs-site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
  - Architecture:
    - Overview: architecture/overview.md
    - API Design: architecture/api-design.md
    - Data Flow: architecture/data-flow.md
  - Guides:
    - Task Creation: guides/task-creation.md
    - DAG Orchestration: guides/dag-orchestration.md
    - Multi-tenancy: guides/multi-tenancy.md
    - Monitoring: guides/monitoring.md
    - Operations: guides/operations.md
  - API Reference:
    - Task API: api/task-api.md
    - Ops API: api/ops-api.md
    - CLI Reference: api/cli-reference.md
  - Deployment:
    - Docker Compose: deployment/docker-compose.md
    - Kubernetes: deployment/kubernetes.md
    - Monitoring Stack: deployment/monitoring-stack.md
  - Contributing:
    - Development Setup: contributing/development.md
    - Testing: contributing/testing.md
    - Code Style: contributing/code-style.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
