site_name: Async Scheduler
site_url: https://zhbxlm.github.io/async-scheduler-framework/
repo_url: https://github.com/zhbxlm/async-scheduler-framework
repo_name: zhbxlm/async-scheduler-framework
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始:
    - 快速启动: getting-started/quick-start.md
    - 安装: getting-started/installation.md
    - 配置: getting-started/configuration.md
  - 架构:
    - 总览: architecture/overview.md
    - API 设计: architecture/api-design.md
    - 数据流: architecture/data-flow.md
  - 使用指南:
    - 任务创建: guides/task-creation.md
    - DAG 编排: guides/dag-orchestration.md
    - 多租户: guides/multi-tenancy.md
    - 监控: guides/monitoring.md
    - 运维: guides/operations.md
  - API 参考:
    - Task API: api/task-api.md
    - Ops API: api/ops-api.md
    - CLI 参考: api/cli-reference.md
  - 部署:
    - Docker Compose: deployment/docker-compose.md
    - Kubernetes: deployment/kubernetes.md
    - 监控栈: deployment/monitoring-stack.md
  - 贡献:
    - 开发环境: contributing/development.md
    - 测试: contributing/testing.md
    - 代码风格: contributing/code-style.md
  - 内部文档:
    - 架构设计: internal/ARCHITECTURE.md
    - API 规范: internal/API.md
    - 监控设计: internal/MONITORING.md
    - 配置参考: internal/configuration.md
    - 测试文档: internal/testing.md
    - 运维手册: internal/operations.md
    - 审计报告: internal/AUDIT_REPORT.md
    - 项目结构: internal/STRUCTURE.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
