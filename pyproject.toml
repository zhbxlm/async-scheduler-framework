[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-scheduler"
version = "0.1.0"
description = "Async scheduling framework with DAG execution, task queue, and cron scheduling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ducc", email = "ducc@baidu.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncmy>=0.2.9",
    "pydantic>=2.0.0",
    "alembic>=1.12.0",
    "apscheduler>=3.10.0",
    "croniter>=1.4.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "fakeredis>=2.23.0",
]

[project.scripts]
async-scheduler = "async_scheduler.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["async_scheduler*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
