[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────
# Root package: "all-in-one" install for development / monorepo
#
# For production / microservice deployments, build individual
# sub-packages from packages/<name>/pyproject.toml instead:
#
#   packages/core     → async-scheduler-core     (models, monitoring, common)
#   packages/platform → async-scheduler-platform (platform, services, workload, middleware)
#   packages/api      → async-scheduler-api      (api)
#   packages/agent    → async-scheduler-agent    (agent)
#   packages/sdk      → async-scheduler-sdk      (sdk, cli)
#   packages/proxy    → async-scheduler-proxy    (proxy)
#
# Build all sub-packages:
#   scripts/build_packages.sh
# ─────────────────────────────────────────────────────────────
[project]
name = "ray-async"
version = "0.1.0"
description = "Ray Async — Enterprise async task scheduling framework with DAG orchestration, multi-tenancy and tidal resource management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ray Async Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "pydantic>=2.5.0",
    "redis>=5.0.0",
    "httpx>=0.25.0",
    "click>=8.1.0",
    "PyYAML>=6.0.0",
    "croniter>=2.0.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.9.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
ray = [
    "ray[default]>=2.9.0",
]
metrics = [
    # Prometheus client now in main dependencies
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "fakeredis>=2.23.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
ray-async = "src.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
