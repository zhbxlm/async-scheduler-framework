[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────────────
# Root package: "all-in-one" install for development / monorepo
#
# For end users, install one of the lightweight user-facing packages:
#
#   pip install async-scheduler-sdk        # Python HTTP client (httpx, pydantic)
#   pip install async-scheduler-worker     # Build Workers — zero required deps
#   pip install async-scheduler-proxy      # Embed fire-and-forget dispatch (redis)
#   pip install async-scheduler-cli        # kubectl-style CLI (httpx, click)
#   pip install async-scheduler-task-api   # Task submission service (FastAPI)
#   pip install async-scheduler-ops-api    # Ops/Admin API service (FastAPI + Ray)
#   pip install async-scheduler-agent      # Worker node agent (FastAPI + Ray)
#
# Task API (port 8001) and Ops API (port 8000) are independent deployments.
# Each package exposes only its own public API — no framework internals.
#
# Build all user-facing packages:
#   scripts/build_packages.sh
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "ray-async"
version = "1.1.0"
description = "Ray Async — Enterprise async task scheduling framework with DAG orchestration, multi-tenancy and tidal resource management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ray Async Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "pydantic>=2.5.0",
    "redis>=5.0.0",
    "httpx>=0.25.0",
    "click>=8.1.0",
    "PyYAML>=6.0.0",
    "croniter>=2.0.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.9.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
ray = [
    "ray[default]>=2.9.0",
]
metrics = [
    # Prometheus client now in main dependencies
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "fakeredis>=2.23.0",
    "aiosqlite>=0.19.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
ray-async = "src.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
