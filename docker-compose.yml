version: '3.9'

# ── 公共环境变量 ──────────────────────────────────────────────────────────
x-env: &env
  # MySQL (port 3307 on host, 3306 inside container)
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: ray_async
  MYSQL_PASSWORD: ray_async
  MYSQL_DATABASE: ray_async

  # Redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # API
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  RAY_ASYNC_API_KEY: dev-secret-key

  # Misc
  LOG_LEVEL: INFO
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: /app

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: api
  image: ray-async:latest
  restart: unless-stopped
  environment:
    <<: *env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

# ── Services ──────────────────────────────────────────────────────────────
services:

  # ── Infrastructure ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ray_async
      MYSQL_USER: ray_async
      MYSQL_PASSWORD: ray_async
    command:
      - mysqld
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"      # expose as 3307 on host (matches dev MySQL port)
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── Application services ──
  api:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      <<: *env
      SERVICE_NAME: ray-async-api
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  agent:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    environment:
      <<: *env
      SERVICE_NAME: ray-async-agent
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "9100"
      AGENT_NODE_ID: "local-node-01"
    ports:
      - "9100:9100"

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  redis_data:
  mysql_data:
