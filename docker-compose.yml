# docker-compose.yml — async-scheduler-framework
# Usage:
#   docker compose up                              # start all services
#   docker compose up ops-api task-api           # start specific API services
#   docker compose --profile dev up               # start with dev tools (Jaeger, etc.)
#   docker compose run --rm test                  # run test suite

version: "3.9"

# ---- Shared environment ----------------------------------------
x-common-env: &common-env
  REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
  MYSQL_URL: mysql+aiomysql://${MYSQL_USER:-scheduler}:${MYSQL_PASSWORD:-scheduler}@mysql:3306/${MYSQL_DB:-scheduler}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DEBUG: ${DEBUG:-false}
  # OpenTelemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  OTEL_SERVICE_NAME: async-scheduler

x-api-common: &api-common
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  environment: *common-env
  depends_on:
    redis:
      condition: service_healthy
    mysql:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - scheduler-net

# ---- Services --------------------------------------------------
services:

  # Ops API (port 8000, Redis-only registries — NO CronScheduler)
  ops-api:
    <<: *api-common
    container_name: scheduler-ops-api
    command: ["python", "-m", "uvicorn", "src.main:app",
              "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports:
      - "${OPS_API_PORT:-8000}:8000"
    environment:
      <<: *common-env
      BACKGROUND__RECONCILE__ENABLED: "false"
      BACKGROUND__CRON__ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scheduler-ops-api.rule=Host(`scheduler.example.com`)"

  # Task API (port 8001, MySQL+Redis, request-serving only)
  task-api:
    <<: *api-common
    container_name: scheduler-task-api
    command: ["python", "-m", "uvicorn", "src.main_tasks:app",
              "--host", "0.0.0.0", "--port", "8001", "--workers", "4"]
    ports:
      - "${TASK_API_PORT:-8001}:8001"
    environment:
      <<: *common-env
      BACKGROUND__RECONCILE__ENABLED: "false"
      BACKGROUND__CRON__ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Control-plane worker (cron / reconcile / compensation)
  control-plane:
    <<: *api-common
    container_name: scheduler-control-plane
    command: ["python", "-m", "src.main_control"]
    environment:
      <<: *common-env
      BACKGROUND__RECONCILE__ENABLED: "true"
      BACKGROUND__CRON__ENABLED: "true"


  # ---- Infrastructure ----------------------------------------

  redis:
    image: redis:7-alpine
    container_name: scheduler-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory ${REDIS_MAXMEM:-2gb}
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - scheduler-net

  mysql:
    image: mysql:8.0
    container_name: scheduler-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DB:-scheduler}
      MYSQL_USER: ${MYSQL_USER:-scheduler}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scheduler}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max_connections=200
      --innodb_buffer_pool_size=512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${MYSQL_USER:-scheduler}",
             "-p${MYSQL_PASSWORD:-scheduler}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - scheduler-net

  # ---- Observability (dev profile) ----------------------------

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: scheduler-jaeger
    profiles: ["dev", "observability"]
    ports:
      - "16686:16686"    # Jaeger UI
      - "4317:4317"      # OTLP gRPC
      - "4318:4318"      # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - scheduler-net

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: scheduler-prometheus
    profiles: ["dev", "observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - scheduler-net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: scheduler-grafana
    profiles: ["dev", "observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./scripts/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - scheduler-net

  # ---- Test runner --------------------------------------------

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: scheduler-test
    profiles: ["test"]
    command: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379/15    # use DB 15 for tests
      MYSQL_URL: ""                        # tests use in-memory SQLite
      ENVIRONMENT: testing
    depends_on:
      - redis
    volumes:
      - .:/app
    networks:
      - scheduler-net

# ---- Volumes & Networks ----------------------------------------
volumes:
  redis-data:
  mysql-data:
  prometheus-data:
  grafana-data:

networks:
  scheduler-net:
    driver: bridge
