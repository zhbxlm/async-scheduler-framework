name: CI

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: scheduler_test
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install -e packages/runtime-core --no-deps
        pip install -e packages/task-api --no-deps
        pip install -e packages/ops-api --no-deps
        pip install -e packages/control-plane --no-deps
        pip install -e packages/agent --no-deps
        pip install pytest pytest-asyncio pytest-timeout httpx
    
    - name: Wait for Redis
      run: |
        for i in {1..30}; do
          if redis-cli -h localhost ping | grep -q PONG; then
            echo "Redis is ready"
            break
          fi
          echo "Waiting for Redis..."
          sleep 1
        done
    
    - name: Wait for MySQL
      run: |
        for i in {1..30}; do
          if mysqladmin -h localhost -u root -ptestpass ping 2>/dev/null | grep -q 'mysqld is alive'; then
            echo "MySQL is ready"
            break
          fi
          echo "Waiting for MySQL..."
          sleep 1
        done
    
    - name: Run tests
      env:
        REDIS_URL: redis://localhost:6379/0
        MYSQL_URL: mysql://root:testpass@localhost/scheduler_test
      run: |
        pip install pytest-cov
        python -m pytest tests/ --tb=short -v --cov=src --cov-report=xml --cov-report=term
    
    - name: Test CLI
      run: |
        python -m pip install click httpx
        python -c "from src.cli.main import cli; print('CLI imports successfully')"
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type check with mypy (optional)
      run: |
        pip install mypy
        mypy src/ --ignore-missing-imports || echo "Type checking completed (warnings allowed)"

    - name: Security scanning with bandit
      run: |
        pip install bandit
        bandit -r src/ -f json -o bandit-report.json || echo "Bandit scan completed"

    - name: Dependency vulnerability scanning
      run: |
        pip install safety
        safety check --json --output safety-report.json || echo "Safety check completed"

  build-packages:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install build tools
      run: pip install build

    - name: Build root (all-in-one) package
      run: python -m build

    - name: Build sub-packages
      run: |
        chmod +x scripts/build_packages.sh
        ./scripts/build_packages.sh

    - name: List built artifacts
      run: |
        echo "=== Root package ==="
        ls dist/*.whl dist/*.tar.gz 2>/dev/null || true
        echo "=== Sub-packages ==="
        find dist/packages -name '*.whl' | sort
    
    - name: Build documentation
      run: |
        pip install mkdocs mkdocs-material mkdocstrings-python
        mkdocs build --site-dir _site
    
    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-packages
        path: |
          dist/*.whl
          dist/*.tar.gz
          dist/packages/**/*.whl
    
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: _site/